<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${title}">Traffic Lights</title>

    <!-- CSRF for JavaScript clients (lecturer style) -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <link rel="icon" type="image/x-icon" th:href="@{/images/favicon.ico}">

    <!-- Webpack bundle: Bootstrap + Bootstrap Icons + project SCSS -->
    <link rel="stylesheet" th:href="@{/css/bundle-site.css}">
    <script th:src="@{/js/bundle-site.js}" defer></script>
</head>
</html>
