<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{intersections.title} + ' - Details'">Intersection Details</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.1/font/bootstrap-icons.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <div th:replace="~{fragments/navigation :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-shrink-0">
        <div class="container mt-4">

        <h2 class="mt-4" th:text="'Intersection ID: ' + ${intersection.id}">Intersection Details</h2>

        <!-- Element visible only on large displays -->
        <div class="alert alert-info d-none d-lg-block" role="alert">
            <i class="bi bi-info-circle"></i> You are viewing detailed information on a large screen
        </div>

        <div class="row mt-4">
            <!-- Left column - Image -->
            <div class="col-lg-6">
                <div class="card">
                    <img th:src="${intersection.intersectionImage != null ? intersection.intersectionImage : '/images/intersections/default.png'}"
                         class="card-img-top"
                         alt="Intersection"
                         style="max-height: 400px; object-fit: cover;">
                </div>
            </div>

            <!-- Right column - Details -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="'ID: ' + ${intersection.id}">ID</h5>

                        <table class="table table-bordered">
                            <tbody>
                                <tr>
                                    <th th:text="#{intersections.table.latitude}">Latitude</th>
                                    <td th:text="${intersection.latitude}">0.0</td>
                                </tr>
                                <tr>
                                    <th th:text="#{intersections.table.longitude}">Longitude</th>
                                    <td th:text="${intersection.longitude}">0.0</td>
                                </tr>
                                <tr>
                                    <th th:text="#{intersections.table.type}">Type</th>
                                    <td>
                                        <span class="badge bg-primary" th:text="${intersection.type}">Type</span>
                                    </td>
                                </tr>
                                <tr>
                                    <th th:text="#{intersections.table.roadCount}">Road Count</th>
                                    <td th:text="${intersection.roadCount}">0</td>
                                </tr>
                                <tr>
                                    <th th:text="#{intersections.table.smartEnabled}">Smart Enabled</th>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${intersection.smartEnabled ? 'bg-success' : 'bg-secondary'}"
                                              th:text="${intersection.smartEnabled ? 'Yes' : 'No'}">
                                            Status
                                        </span>
                                    </td>
                                </tr>
                                <tr>
                                    <th th:text="#{intersections.table.openedOn}">Opened On</th>
                                    <td th:text="${intersection.openedOn}">2020-01-01</td>
                                </tr>
                                <tr>
                                    <th th:text="#{intersections.table.pedestrianCrossing}">Pedestrian Crossing</th>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${intersection.hasPedestrianCrossing ? 'bg-success' : 'bg-secondary'}"
                                              th:text="${intersection.hasPedestrianCrossing ? 'Yes' : 'No'}">
                                            Status
                                        </span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="mt-3">
                            <a th:href="@{/intersections}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Back to List
                            </a>
                            <form th:action="@{/intersection/{id}/delete(id=${intersection.id})}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this intersection? This will also delete all related traffic lights and maintenance logs.');">
                                <button type="submit" class="btn btn-danger">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Related Traffic Lights Section -->
        <div class="row mt-4" th:if="${trafficLights != null && !trafficLights.isEmpty()}">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="bi bi-traffic-light"></i> Traffic Lights at this Intersection</h5>
                    </div>
                    <div class="card-body">
                        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
                            <div class="col" th:each="light : ${trafficLights}">
                                <div class="card h-100 shadow-sm" style="cursor: pointer;" th:onclick="'window.location.href=\'/trafficLight/' + ${light.id} + '\''">
                                    <div class="card-body">
                                        <h6 class="card-title" th:text="'Traffic Light #' + ${light.id}">Light ID</h6>
                                        <p class="card-text mb-1">
                                            <strong>Status:</strong>
                                            <span class="badge"
                                                  th:classappend="${light.status.name() == 'BROKEN' ? 'bg-danger' : (light.status.name() == 'MAINTENANCE' ? 'bg-warning text-dark' : (light.status.name() == 'ACTIVE' ? 'bg-success' : 'bg-secondary'))}"
                                                  th:text="${light.status}">Status</span>
                                        </p>
                                        <p class="card-text mb-1">
                                            <strong>Direction:</strong> <span th:text="${light.direction}">N</span>
                                        </p>
                                        <p class="card-text mb-0">
                                            <strong>Type:</strong> <span th:text="${light.type}">Type</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/navigation :: footer}"></div>

    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>

    <!-- Form Validation Script -->
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
