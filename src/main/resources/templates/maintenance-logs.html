<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{maintenanceLogs.title}">Maintenance Logs</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bundle-site.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <div th:replace="~{fragments/navigation :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-shrink-0">
        <div class="container my-4">
            <h2 class="mb-4" th:text="#{maintenanceLogs.title}">Maintenance Logs</h2>

            <!-- Filter Form -->
            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" th:action="@{/maintenanceLogs}" class="row g-3">
                        <div class="col-md-8">
                            <label for="completed" class="form-label" th:text="#{maintenanceLogs.filter.completed}">Filter by Completed:</label>
                            <select class="form-select" id="completed" name="completed">
                                <option value="" th:text="#{intersections.filter.all}">All</option>
                                <option value="true" th:selected="${selectedCompleted == true}" th:text="#{intersections.filter.yes}">Yes</option>
                                <option value="false" th:selected="${selectedCompleted == false}" th:text="#{intersections.filter.no}">No</option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-funnel"></i>
                                <span th:text="#{maintenanceLogs.filter.button}">Filter</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

    <!-- Bootstrap Cards Grid: 1 column on mobile, 2 on tablet, 4 on desktop -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            <div class="col" th:each="log : ${maintenanceLogs}">
                <div class="card h-100 shadow-sm"
                     th:classappend="${!log.completed} ? 'border-warning' : 'border-success'">

                    <!-- Card Body -->
                    <a th:href="@{/maintenanceLog/{id}(id=${log.id})}"
                       class="card-body text-decoration-none text-body">
                        <h5 class="card-title" th:text="${'Log #' + log.id}">Log ID</h5>
                        <p class="card-text">
                            <strong th:text="#{maintenanceLogs.table.kind} + ':'">Kind:</strong>
                            <span th:text="${log.kind}">Kind</span>
                        </p>
                        <p class="card-text">
                            <small th:text="${log.description}">Description</small>
                        </p>
                        <p class="card-text">
                            <span class="badge"
                                  th:classappend="${log.completed ? 'bg-success' : 'bg-warning text-dark'}"
                                  th:text="${log.completed ? 'Completed' : 'In Progress'}">
                                Status
                            </span>
                        </p>
                        <p class="card-text">
                            <strong>Cost:</strong>
                            <span th:text="${'$' + log.cost}">$0.00</span>
                        </p>
                    </a>

                    <!-- Card Footer -->
                    <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
                        <small class="text-muted" th:text="#{maintenanceLogs.table.date} + ': ' + ${log.date}">
                            Date: 2020-01-01
                        </small>
                        <form th:action="@{/maintenanceLog/{id}/delete(id=${log.id})}" method="post"
                              class="d-inline"
                              data-confirm-message="Are you sure you want to delete this maintenance log?">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash" aria-hidden="true"></i>
                                <span class="visually-hidden" th:text="${'Delete maintenance log ' + log.id}">Delete maintenance log</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="item-count mt-4 text-center">
        <span th:text="#{maintenanceLogs.count}">Total maintenance logs displayed:</span>
        <span th:text="${#lists.size(maintenanceLogs)}">0</span>
    </div>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/navigation :: footer}"></div>

    <!-- Bootstrap JS -->
    <script th:src="@{/js/bundle-site.js}" defer></script>
    <script th:src="@{/js/bundle-form-validation.js}" defer></script>
</body>
</html>
