<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{addMaintenanceLog.title}">Add Maintenance Log</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.1/font/bootstrap-icons.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<!-- Navbar -->
<div th:replace="~{fragments/navigation :: navbar}"></div>

<!-- Main Content -->
<main class="flex-shrink-0">
    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">
                            <i class="bi bi-journal-text"></i>
                            <span th:text="#{addMaintenanceLog.title}">Add New Maintenance Log</span>
                        </h3>
                    </div>
                    <div class="card-body">
                        <!-- Error Alert -->
                        <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            <strong th:text="#{error.title}">Error!</strong>
                            <span th:text="${errorMessage}">An error occurred.</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form method="post" th:action="@{/addMaintenanceLog}">
                            <div class="row">
                                <!-- Date -->
                                <div class="col-md-6 mb-3">
                                    <label for="date" class="form-label" th:text="#{addMaintenanceLog.form.date}">Date:</label>
                                    <input type="date" class="form-control" id="date" name="date" th:value="${date}" required>
                                    <div class="invalid-feedback">Please provide a date.</div>
                                </div>

                                <!-- Kind -->
                                <div class="col-md-6 mb-3">
                                    <label for="kind" class="form-label" th:text="#{addMaintenanceLog.form.kind}">Kind:</label>
                                    <select class="form-select" id="kind" name="kind" required>
                                        <option value="">Choose...</option>
                                        <option th:each="type : ${logTypes}" th:value="${type}" th:text="${type}"
                                                th:selected="${type == kind}"></option>
                                    </select>
                                    <div class="invalid-feedback">Please select a kind.</div>
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="mb-3">
                                <label for="description" class="form-label" th:text="#{addMaintenanceLog.form.description}">Description:</label>
                                <textarea class="form-control" id="description" name="description" rows="3" th:text="${description}" required></textarea>
                                <div class="invalid-feedback">Please provide a description.</div>
                            </div>

                            <div class="row">
                                <!-- Cost -->
                                <div class="col-md-6 mb-3">
                                    <label for="cost" class="form-label" th:text="#{addMaintenanceLog.form.cost}">Cost:</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" step="0.01" class="form-control" id="cost" name="cost" th:value="${cost}" required>
                                        <div class="invalid-feedback">Please provide cost.</div>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <!-- Traffic Light -->
                                <div class="col-md-6 mb-3">
                                    <label for="trafficLightId" class="form-label" th:text="#{addMaintenanceLog.form.trafficLight}">Traffic Light:</label>
                                    <select class="form-select" id="trafficLightId" name="trafficLightId" required>
                                        <option value="">Choose...</option>
                                        <option th:each="tl : ${trafficLights}"
                                                th:value="${tl.id}"
                                                th:text="${'ID: ' + tl.id + ' - ' + tl.status}"
                                                th:selected="${tl.id == trafficLightId}"></option>
                                    </select>
                                    <div class="invalid-feedback">Please select a traffic light.</div>
                                </div>

                                <!-- Invoice Number -->
                                <div class="col-md-6 mb-3">
                                    <label for="invoiceNumber" class="form-label" th:text="#{addMaintenanceLog.form.invoiceNumber}">Invoice Number:</label>
                                    <input type="text" class="form-control" id="invoiceNumber" name="invoiceNumber" th:value="${invoiceNumber}" placeholder="Optional">
                                </div>
                            </div>

                            <!-- Completed Checkbox -->
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="completed" name="completed" th:checked="${completed}">
                                    <label class="form-check-label" for="completed" th:text="#{addMaintenanceLog.form.completed}">
                                        Completed
                                    </label>
                                </div>
                            </div>

                            <!-- Buttons -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a th:href="@{/maintenanceLogs}" class="btn btn-secondary">
                                    <i class="bi bi-x-circle"></i> Cancel
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i>
                                    <span th:text="#{addMaintenanceLog.form.submit}">Add Maintenance Log</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<div th:replace="~{fragments/navigation :: footer}"></div>

<!-- Bootstrap JS -->
<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/form-validation.js}"></script>
</body>
</html>
