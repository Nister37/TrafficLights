<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{maintenanceCompanies.title}">Maintenance Companies</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.1/font/bootstrap-icons.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <div th:replace="~{fragments/navigation :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-shrink-0">
        <div class="container my-4">
            <h2 class="mb-4" th:text="#{maintenanceCompanies.title}">Maintenance Companies</h2>

            <!-- Filter Form -->
            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" th:action="@{/maintenanceCompanies}" class="row g-3">
                        <div class="col-md-5">
                            <label for="name" class="form-label" th:text="#{maintenanceCompanies.filter.name}">Filter by Name:</label>
                            <input type="text" class="form-control" id="name" name="name" th:value="${selectedName}" th:placeholder="#{maintenanceCompanies.filter.namePlaceholder}">
                        </div>
                        <div class="col-md-4">
                            <label for="active" class="form-label" th:text="#{maintenanceCompanies.filter.active}">Active:</label>
                            <select class="form-select" id="active" name="active">
                                <option value="" th:text="#{intersections.filter.all}">All</option>
                                <option value="true" th:selected="${selectedActive == true}" th:text="#{intersections.filter.yes}">Yes</option>
                                <option value="false" th:selected="${selectedActive == false}" th:text="#{intersections.filter.no}">No</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-funnel"></i>
                                <span th:text="#{maintenanceCompanies.filter.button}">Filter</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

    <!-- Bootstrap Cards Grid: 1 column on mobile, 2 on tablet, 4 on desktop -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            <div class="col" th:each="company : ${companies}">
                <div class="card h-100 shadow-sm" style="cursor: pointer;" th:onclick="'window.location.href=\'/maintenanceCompany/' + ${company.id} + '\''"
                     th:classappend="${!company.active} ? 'border-secondary' : 'border-primary'">

                    <!-- Card Body -->
                    <div class="card-body">
                        <h5 class="card-title" th:text="${company.name}">Company Name</h5>
                        <p class="card-text">
                            <span class="badge"
                                  th:classappend="${company.active ? 'bg-success' : 'bg-secondary'}"
                                  th:text="${company.active ? 'Active' : 'Inactive'}">
                                Status
                            </span>
                        </p>
                        <p class="card-text">
                            <i class="bi bi-telephone"></i>
                            <small th:text="${company.contactPhone}">Phone</small>
                        </p>
                        <p class="card-text">
                            <i class="bi bi-envelope"></i>
                            <small th:text="${company.contactEmail}">Email</small>
                        </p>
                    </div>

                    <!-- Card Footer -->
                    <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
                        <small class="text-muted" th:text="#{maintenanceCompanies.table.since} + ': ' + ${company.since}">
                            Since: 2020-01-01
                        </small>
                        <form th:action="@{/maintenanceCompany/{id}/delete(id=${company.id})}" method="post" style="display: inline;"
                              onsubmit="event.stopPropagation(); return confirm('Are you sure you want to delete this maintenance company?');"
                              onclick="event.stopPropagation();">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="item-count mt-4 text-center">
        <span th:text="#{maintenanceCompanies.count}">Total maintenance companies displayed:</span>
        <span th:text="${#lists.size(companies)}">0</span>
    </div>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/navigation :: footer}"></div>

    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/form-validation.js}"></script>
</body>
</html>
