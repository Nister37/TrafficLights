<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{maintenanceCompanies.title} + ' - Details'">Maintenance Company Details</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bundle-site.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <div th:replace="~{fragments/navigation :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-shrink-0">
        <div class="container mt-4">

        <h2 class="mt-4" th:text="${company.name}">Company Details</h2>

        <!-- Element visible only on large displays -->
        <div class="alert alert-info d-none d-lg-block" role="alert">
            <i class="bi bi-info-circle"></i> You are viewing detailed information on a large screen
        </div>

        <div class="row mt-4">
            <!-- Details -->
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="'ID: ' + ${company.id}">ID</h5>

                        <table class="table table-bordered">
                            <tbody>
                                <tr>
                                    <th th:text="#{maintenanceCompanies.table.name}">Name</th>
                                    <td th:text="${company.name}">Company Name</td>
                                </tr>
                                <tr>
                                    <th th:text="#{maintenanceCompanies.table.contactPhone}">Contact Phone</th>
                                    <td>
                                        <i class="bi bi-telephone"></i>
                                        <a th:href="'tel:' + ${company.contactPhone}" th:text="${company.contactPhone}">Phone</a>
                                    </td>
                                </tr>
                                <tr>
                                    <th th:text="#{maintenanceCompanies.table.contactEmail}">Contact Email</th>
                                    <td>
                                        <i class="bi bi-envelope"></i>
                                        <a th:href="'mailto:' + ${company.contactEmail}" th:text="${company.contactEmail}">Email</a>
                                    </td>
                                </tr>
                                <tr>
                                    <th th:text="#{maintenanceCompanies.table.active}">Active</th>
                                    <td>
                                        <span class="badge"
                                              th:classappend="${company.active ? 'bg-success' : 'bg-secondary'}"
                                              th:text="${company.active ? 'Yes' : 'No'}">
                                            Status
                                        </span>
                                    </td>
                                </tr>
                                <tr>
                                    <th th:text="#{maintenanceCompanies.table.since}">Since</th>
                                    <td th:text="${company.since}">2020-01-01</td>
                                </tr>
                            </tbody>
                        </table>

                        <div class="mt-3">
                            <a th:href="@{/maintenanceCompanies}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Back to List
                            </a>
                            <form th:action="@{/maintenanceCompany/{id}/delete(id=${company.id})}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this maintenance company?');">
                                <button type="submit" class="btn btn-danger">
                                    <i class="bi bi-trash"></i> Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Related Maintenance Logs Section (Many-to-Many) -->
        <div class="row mt-4" th:if="${company.maintenanceLogs != null && !company.maintenanceLogs.isEmpty()}">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h5 class="mb-0"><i class="bi bi-list-check"></i> Maintenance Logs by this Company</h5>
                    </div>
                    <div class="card-body">
                        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
                            <div class="col" th:each="log : ${company.maintenanceLogs}">
                                <div class="card h-100 shadow-sm" style="cursor: pointer;" th:onclick="'window.location.href=\'/maintenanceLog/' + ${log.id} + '\''">
                                    <div class="card-body">
                                        <h6 class="card-title" th:text="'Log #' + ${log.id}">Log ID</h6>
                                        <p class="card-text mb-1">
                                            <strong>Date:</strong> <span th:text="${log.date}">2023-01-01</span>
                                        </p>
                                        <p class="card-text mb-1">
                                            <strong>Kind:</strong> <span th:text="${log.kind}">Kind</span>
                                        </p>
                                        <p class="card-text mb-1">
                                            <strong>Cost:</strong> <span th:text="${'$' + log.cost}">$0.00</span>
                                        </p>
                                        <p class="card-text mb-0">
                                            <span class="badge"
                                                  th:classappend="${log.completed ? 'bg-success' : 'bg-warning text-dark'}"
                                                  th:text="${log.completed ? 'Completed' : 'In Progress'}">Status</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/navigation :: footer}"></div>

    <!-- Bootstrap JS -->
    <script th:src="@{/js/bundle-site.js}" defer></script>
</body>
</html>
