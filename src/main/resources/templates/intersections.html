<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{intersections.title}">Intersections</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bundle-site.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <div th:replace="~{fragments/navigation :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-shrink-0">
        <div class="container my-4">
            <h2 class="mb-4" th:text="#{intersections.title}">Intersections</h2>

            <!-- Filter Form -->
            <div class="card mb-4">
                <div class="card-body">
                    <form method="get" th:action="@{/intersections}" class="row g-3">
                        <div class="col-md-4">
                            <label for="type" class="form-label" th:text="#{intersections.filter.type}">Filter by Type:</label>
                            <select class="form-select" id="type" name="type">
                                <option value="" th:text="#{intersections.filter.allTypes}">All Types</option>
                                <option th:each="t : ${intersectionTypes}"
                                        th:value="${t}"
                                        th:text="${t}"
                                        th:selected="${t == selectedType}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="isSmartEnabled" class="form-label" th:text="#{intersections.filter.smartEnabled}">Smart Enabled:</label>
                            <select class="form-select" id="isSmartEnabled" name="isSmartEnabled">
                                <option value="" th:text="#{intersections.filter.all}">All</option>
                                <option value="true" th:selected="${selectedSmartEnabled == true}" th:text="#{intersections.filter.yes}">Yes</option>
                                <option value="false" th:selected="${selectedSmartEnabled == false}" th:text="#{intersections.filter.no}">No</option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-funnel"></i>
                                <span th:text="#{intersections.filter.button}">Filter</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

    <!-- Bootstrap Cards Grid: 1 column on mobile, 2 on tablet, 4 on desktop -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            <div class="col" th:each="intersection : ${intersections}">
                <div class="card h-100 shadow-sm" style="cursor: pointer;" th:onclick="'window.location.href=\'/intersection/' + ${intersection.id} + '\''">
                    <!-- Card Image -->
                    <img th:src="${intersection.intersectionImage != null ? intersection.intersectionImage : '/images/intersections/default.png'}"
                         class="card-img-top"
                         alt="Intersection"
                         style="height: 200px; object-fit: cover;">

                    <!-- Card Body -->
                    <div class="card-body">
                        <h5 class="card-title" th:text="${'ID: ' + intersection.id}">Intersection ID</h5>
                        <p class="card-text">
                            <strong th:text="#{intersections.table.type} + ':'">Type:</strong>
                            <span th:text="${intersection.type}">Type</span>
                        </p>
                        <p class="card-text">
                            <strong th:text="#{intersections.table.roadCount} + ':'">Road Count:</strong>
                            <span th:text="${intersection.roadCount}">0</span>
                        </p>
                        <p class="card-text">
                            <span class="badge"
                                  th:classappend="${intersection.smartEnabled ? 'bg-success' : 'bg-secondary'}"
                                  th:text="${intersection.smartEnabled ? 'Smart Enabled' : 'Not Smart'}">
                                Smart Status
                            </span>
                        </p>
                    </div>

                    <!-- Card Footer -->
                    <div class="card-footer bg-transparent d-flex justify-content-between align-items-center">
                        <small class="text-muted" th:text="#{intersections.table.openedOn} + ': ' + ${intersection.openedOn}">
                            Opened: 2020-01-01
                        </small>
                        <form th:action="@{/intersection/{id}/delete(id=${intersection.id})}" method="post" style="display: inline;"
                              onsubmit="event.stopPropagation(); return confirm('Are you sure you want to delete this intersection?');"
                              onclick="event.stopPropagation();">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="item-count mt-4 text-center">
        <span th:text="#{intersections.count}">Total intersections displayed:</span>
        <span th:text="${#lists.size(intersections)}">0</span>
    </div>

    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/navigation :: footer}"></div>

    <!-- Bootstrap JS -->
    <script th:src="@{/js/bundle-site.js}" defer></script>
    <script th:src="@{/js/bundle-form-validation.js}" defer></script>
</body>
</html>
