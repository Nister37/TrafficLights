<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Traffic Lights Management</title>
    <link rel="stylesheet" th:href="@{/css/bundle-site.css}">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100">

<div class="card shadow login-card">
    <div class="card-header bg-dark text-white text-center py-4">
        <i class="bi bi-traffic-light fs-1"></i>
        <h4 class="mt-2 mb-0">Traffic Lights Management</h4>
    </div>
    <div class="card-body p-4">

        <!-- Error message -->
        <div th:if="${param.error}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle"></i> Invalid username or password.
        </div>

        <!-- Logout message -->
        <div th:if="${param.logout}" class="alert alert-success">
            <i class="bi bi-check-circle"></i> You have been logged out.
        </div>

        <form method="post" th:action="@{/login}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username"
                       name="username" placeholder="Enter username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password"
                       name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <!-- Demo credentials -->
        <hr class="mt-4">
        <p class="text-muted small mb-1"><strong>Demo credentials:</strong></p>
        <ul class="text-muted small mb-0">
            <li><code>admin</code> / <code>admin123</code> (<strong>ADMIN</strong>)</li>
            <li><code>user1</code> / <code>user123</code> (<strong>USER</strong>)</li>
            <li><code>user2</code> / <code>user123</code> (<strong>USER</strong>)</li>
        </ul>
    </div>
</div>

<script th:src="@{/js/bundle-site.js}" defer></script>
</body>
</html>
