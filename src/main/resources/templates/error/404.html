<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Not Found</title>
    <link rel="stylesheet" th:href="@{/css/bundle-site.css}">
    <script th:src="@{/js/bundle-site.js}" defer></script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
<div th:replace="~{fragments/navigation :: navbar}"></div>

<main class="flex-shrink-0">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow">
                    <div class="card-body py-5">
                        <i class="bi bi-exclamation-triangle text-warning" style="font-size: 4rem;"></i>
                        <h1 class="mt-3">404</h1>
                        <h4 class="text-muted">Page Not Found</h4>
                        <p class="text-muted mt-3" th:if="${message}" th:text="${message}">Error message</p>
                        <p class="text-muted mt-3" th:unless="${message}">The page you are looking for does not exist.</p>
                        <a href="/" class="btn btn-primary mt-3">
                            <i class="bi bi-house"></i> Go Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/navigation :: footer}"></div>
</body>
</html>
