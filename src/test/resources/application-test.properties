# =============================================================================
# Test profile configuration ? uses H2 in-memory database
# Activated via @ActiveProfiles("test") on test classes
# =============================================================================

# H2 in-memory datasource (no external database required)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate: create schema on startup, drop on shutdown
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true

# Do NOT run data.sql during tests ? tests seed their own data
spring.sql.init.mode=never

# H2 compatibility mode for PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Open Session in View (consistent with production config)
spring.jpa.open-in-view=false

# Reduce log noise during test runs
logging.level.be.kdg.programming5=WARN
logging.level.org.hibernate.SQL=WARN

