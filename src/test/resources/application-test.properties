# =============================================================================
# Test profile configuration — uses PostgreSQL (same server as dev)
# Activated via @ActiveProfiles("test") on test classes
#
# CI_DB_HOST_PORT is injected by the GitLab CI pipeline (postgres:5432).
# Locally it falls back to the docker-compose PostgreSQL at localhost:9432.
# =============================================================================

# PostgreSQL datasource — variable allows the same file to work in CI and locally
spring.datasource.url=jdbc:postgresql://${CI_DB_HOST_PORT:localhost:9432}/programming5
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=student
spring.datasource.password=Student_1234

# Hibernate: recreate schema on startup, drop on shutdown
# Tests seed their own data in @BeforeEach and clean up in @AfterEach
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Do NOT run data.sql during tests — tests seed their own data
spring.sql.init.mode=never

spring.jpa.open-in-view=false

# Reduce log noise during test runs
logging.level.be.kdg.programming5=WARN
logging.level.org.hibernate.SQL=WARN

