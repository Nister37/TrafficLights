stages:
  - build
  - test

# Disable the Gradle daemon — it is not useful in a short-lived CI container
variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

build:
  stage: build
  # eclipse-temurin:21-jdk-alpine (musl libc) cannot run the glibc-compiled Node.js
  # binaries that node-gradle downloads. Switched to the Ubuntu (jammy) variant
  image: eclipse-temurin:21-jdk-jammy
  script:
    - ./gradlew --build-cache assemble
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle
      - .node

test:
  stage: test
  image: eclipse-temurin:21-jdk-jammy
  services:
    - postgres:16.1-alpine
  variables:
    # PostgreSQL service credentials — must match application-test.properties
    POSTGRES_DB: "programming5_test"
    POSTGRES_USER: "student"
    POSTGRES_PASSWORD: "Student_1234"
    # Overrides the localhost:9433 fallback in application-test.properties
    # GitLab CI resolves the service by its image name: "postgres"
    CI_DB_HOST_PORT: "postgres:5432"
  script:
    - ./gradlew check
  artifacts:
    # Publish the JUnit report even when tests fail so failures are visible in the pipeline
    when: always
    reports:
      junit: build/test-results/test/**/TEST-*.xml
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle
      - .node

